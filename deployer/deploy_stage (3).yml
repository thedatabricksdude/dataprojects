name: Deploy stage (reusable)

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      sha:
        required: true
        type: string
      pr_number:
        required: false
        type: string
      stage_name:
        required: true
        type: string
      target_env:
        required: true
        type: string
      dbx_bundle_dir:
        required: false
        type: string
      debug:
        required: false
        type: string
    secrets:
      GH_APP_PRIVATE_KEY:
        required: true
      DEPLOYER_CLIENT_SECRET:
        required: true
      DATABRICKS_ACCOUNT_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}

    env:
      TARGET_ENV: ${{ inputs.target_env }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DEPLOYER_CLIENT_ID }}
      DEBUG: ${{ inputs.debug || '' }}
      KEEP_FED_POLICY: ${{ vars.KEEP_FED_POLICY || 'false' }}

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: CLADevOps
          permission-contents: write
          permission-issues: write

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Get OAuth token
        run: |
          token_json="$(curl -sS -X POST \
            "https://login.microsoftonline.com/${{ vars.DEPLOYER_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ vars.DEPLOYER_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.DEPLOYER_CLIENT_SECRET }}" \
            -d "grant_type=client_credentials" \
            -d "scope=2ff814a6-3304-4ab8-85cb-cd0e6f879c1d/.default")"

          echo "ACCOUNT_OAUTH_TOKEN=$(echo "$token_json" | jq -r .access_token)" >> "$GITHUB_ENV"

      - name: Create Federation Policy
        run: |
          payload=$(jq -n \
            --arg sub "repo:${{ inputs.repo }}:environment:${TARGET_ENV}" \
            '{ oidc_policy: { issuer: "https://token.actions.githubusercontent.com", audiences: ["'"$DATABRICKS_HOST"'/oidc/v1/token"], subject: $sub } }')

          resp=$(curl -sS -X POST \
            "${{ vars.DATABRICKS_ACCOUNT_HOST }}/api/2.0/accounts/${{ secrets.DATABRICKS_ACCOUNT_ID }}/servicePrincipals/${{ vars.DEPLOYER_PRINCIPAL_ID }}/federationPolicies" \
            -H "Authorization: Bearer $ACCOUNT_OAUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "DATABRICKS_FED_POLICY_ID=$(echo "$resp" | jq -r '.policy_id // .uid')" >> "$GITHUB_ENV"

      - name: Prepare bundle dir
        run: |
          dir="${{ inputs.dbx_bundle_dir }}"
          [[ -z "$dir" ]] && dir="."
          echo "BUNDLE_WORKDIR=$dir" >> "$GITHUB_ENV"

      - name: Change to bundle directory
        id: bundle_dir
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          echo "DEBUG: github.workspace=$GITHUB_WORKSPACE"
          echo "DEBUG: starting pwd=$(pwd)"
          echo "DEBUG: BUNDLE_WORKDIR raw='${BUNDLE_WORKDIR:-}'"

          dir="${BUNDLE_WORKDIR:-}"
          [[ -z "$dir" ]] && dir="."

          if [[ "$dir" == "." ]]; then
            resolved_dir="$GITHUB_WORKSPACE"
          else
            resolved_dir="$GITHUB_WORKSPACE/$dir"
          fi

          echo "DEBUG: resolved_dir=$resolved_dir"

          if [[ ! -d "$resolved_dir" ]]; then
            echo "ERROR: bundle directory '$resolved_dir' does not exist"
            exit 1
          fi

          echo "DEBUG: listing resolved_dir"
          ls -la "$resolved_dir"

          echo "bundle_run_dir=$resolved_dir" >> "$GITHUB_OUTPUT"

      - name: Notify stage started
        if: ${{ inputs.pr_number != '' }}
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(jq -n \
            --arg msg "🚀 ${TARGET_ENV} deployment started"$'\n'"Run: ${RUN_URL}" \
            '{body: $msg}')"

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ steps.generate-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ inputs.repo }}/issues/${{ inputs.pr_number }}/comments" \
            -d "$body"

      ########################################
      # PREDEPLOY
      ########################################

      - name: Run predeploy notebooks
        shell: bash
        working-directory: ${{ steps.bundle_dir.outputs.bundle_run_dir }}
        run: |
          set -euo pipefail
          echo "DEBUG: predeploy notebooks pwd=$(pwd)"
          echo "DEBUG: checking for databricks.yml in $(pwd)"
          ls -la

          for f in deployments/predeploy/notebooks/*; do
            [[ -f "$f" ]] || continue
            name="$(basename "$f")"
            job="${name%.*}"
            echo "Running bundle job: $job"

            out_file="$(mktemp)"
            set +e
            databricks bundle run "$job" -t "${{ inputs.stage_name }}" >"$out_file" 2>&1
            rc=$?
            set -e

            if (( rc != 0 )); then
              if grep -qiE 'resource with key ".*" not found|job ID is not an integer|resource .* not found' "$out_file"; then
                echo "Skipping $job because it does not appear to be deployed yet."
                cat "$out_file"
                rm -f "$out_file"
                continue
              fi

              echo "ERROR: bundle run failed for $job"
              cat "$out_file"
              rm -f "$out_file"
              exit "$rc"
            fi

            rm -f "$out_file"
          done

      - name: Run predeploy bash
        shell: bash
        run: |
          set -euo pipefail
          echo "DEBUG: predeploy bash pwd=$(pwd)"
          dir="${{ steps.bundle_dir.outputs.bundle_run_dir }}/deployments/predeploy/bash"
          echo "DEBUG: predeploy bash dir=$dir"
          [[ -d "$dir" ]] || exit 0
          for f in "$dir"/*.sh; do
            [[ -e "$f" ]] || continue
            bash "$f"
          done

      - name: Run predeploy python
        shell: bash
        run: |
          set -euo pipefail
          echo "DEBUG: predeploy python pwd=$(pwd)"
          dir="${{ steps.bundle_dir.outputs.bundle_run_dir }}/deployments/predeploy/python"
          echo "DEBUG: predeploy python dir=$dir"
          [[ -d "$dir" ]] || exit 0
          for f in "$dir"/*.py; do
            [[ -e "$f" ]] || continue
            python "$f"
          done

      ########################################
      # DEPLOY
      ########################################

      - name: Validate
        shell: bash
        working-directory: ${{ steps.bundle_dir.outputs.bundle_run_dir }}
        run: |
          set -euo pipefail
          echo "DEBUG: validate pwd=$(pwd)"
          echo "DEBUG: validate ls"
          ls -la
          databricks bundle validate -t "${{ inputs.stage_name }}"

      - name: Deploy
        shell: bash
        working-directory: ${{ steps.bundle_dir.outputs.bundle_run_dir }}
        run: |
          set -euo pipefail
          echo "DEBUG: deploy pwd=$(pwd)"
          echo "DEBUG: deploy ls"
          ls -la
          databricks bundle deploy -t "${{ inputs.stage_name }}" --auto-approve --force-lock

      ########################################
      # POSTDEPLOY
      ########################################

      - name: Run postdeploy notebooks
        shell: bash
        working-directory: ${{ steps.bundle_dir.outputs.bundle_run_dir }}
        run: |
          set -euo pipefail
          echo "DEBUG: postdeploy notebooks pwd=$(pwd)"
          echo "DEBUG: checking for databricks.yml in $(pwd)"
          ls -la

          for f in deployments/postdeploy/notebooks/*; do
            [[ -f "$f" ]] || continue
            name="$(basename "$f")"
            job="${name%.*}"
            echo "Running bundle job: $job"

            out_file="$(mktemp)"
            set +e
            databricks bundle run "$job" -t "${{ inputs.stage_name }}" >"$out_file" 2>&1
            rc=$?
            set -e

            if (( rc != 0 )); then
              if grep -qiE 'resource with key ".*" not found|job ID is not an integer|resource .* not found' "$out_file"; then
                echo "Skipping $job because it does not appear to be deployed yet."
                cat "$out_file"
                rm -f "$out_file"
                continue
              fi

              echo "ERROR: bundle run failed for $job"
              cat "$out_file"
              rm -f "$out_file"
              exit "$rc"
            fi

            rm -f "$out_file"
          done

      - name: Run postdeploy bash
        shell: bash
        run: |
          set -euo pipefail
          echo "DEBUG: postdeploy bash pwd=$(pwd)"
          dir="${{ steps.bundle_dir.outputs.bundle_run_dir }}/deployments/postdeploy/bash"
          echo "DEBUG: postdeploy bash dir=$dir"
          [[ -d "$dir" ]] || exit 0
          for f in "$dir"/*.sh; do
            [[ -e "$f" ]] || continue
            bash "$f"
          done

      - name: Run postdeploy python
        shell: bash
        run: |
          set -euo pipefail
          echo "DEBUG: postdeploy python pwd=$(pwd)"
          dir="${{ steps.bundle_dir.outputs.bundle_run_dir }}/deployments/postdeploy/python"
          echo "DEBUG: postdeploy python dir=$dir"
          [[ -d "$dir" ]] || exit 0
          for f in "$dir"/*.py; do
            [[ -e "$f" ]] || continue
            python "$f"
          done

      ########################################
      # CLEANUP
      ########################################

      - name: Delete Federation Policy
        if: always()
        run: |
          [[ -z "$DATABRICKS_FED_POLICY_ID" ]] && exit 0

          curl -sS -X DELETE \
            "${{ vars.DATABRICKS_ACCOUNT_HOST }}/api/2.0/accounts/${{ secrets.DATABRICKS_ACCOUNT_ID }}/servicePrincipals/${{ vars.DEPLOYER_PRINCIPAL_ID }}/federationPolicies/$DATABRICKS_FED_POLICY_ID" \
            -H "Authorization: Bearer $ACCOUNT_OAUTH_TOKEN"

      - name: Notify stage complete
        if: ${{ always() && inputs.pr_number != '' }}
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          STATUS="${{ job.status }}"
          body="$(jq -n \
            --arg msg "${STATUS} ${TARGET_ENV} deployment finished"$'\n'"Run: ${RUN_URL}" \
            '{body: $msg}')"

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ steps.generate-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ inputs.repo }}/issues/${{ inputs.pr_number }}/comments" \
            -d "$body"
